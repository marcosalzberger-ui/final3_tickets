<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Final3 Einlass</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{margin:0;background:#0f172a;color:#fff}
  .wrap{max-width:520px;margin:0 auto;padding:12px}
  h1{font-size:20px;margin:6px 0 12px}
  input{width:100%;padding:14px;font-size:18px;border-radius:12px;border:0;margin:6px 0}
  .btn{display:block;width:100%;padding:14px;font-size:18px;font-weight:700;border:0;border-radius:14px;background:#334155;color:#fff;cursor:pointer;margin:8px 0}
  .primary{background:#2563eb}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#cbd5e1}
  .count{font-size:26px;font-weight:800;color:#fff}
  .cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1/1;margin:10px 0}
  video{width:100%;height:100%;object-fit:cover;display:block}
  .frame{position:absolute;inset:18%;border:4px solid rgba(255,255,255,.85);border-radius:18px}
  #overlay{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:16px}
  #overlay .t{font-size:30px;font-weight:800}
  #overlay .d{font-size:17px;margin-top:8px;white-space:pre-line}
  .ok{background:rgba(22,163,74,.95)}.used{background:rgba(234,88,12,.95)}.invalid{background:rgba(220,38,38,.95)}.err{background:rgba(124,58,237,.95)}.wait{background:rgba(15,23,42,.8)}
  .row{display:flex;gap:8px}.row input{flex:1}.row .btn{width:auto;margin:6px 0}
  ul{list-style:none;padding:0;margin:8px 0;font-size:14px;color:#cbd5e1}
  li{padding:6px 0;border-bottom:1px solid #1e293b}
  .small{background:transparent;color:#94a3b8;font-size:14px;font-weight:400;padding:6px;width:auto}
  #msg{color:#fca5a5;min-height:20px}
</style>
</head>
<body>
<div class="wrap">

  <div id="setup">
    <h1>🎟️ Final3 Einlass</h1>
    <input id="url" placeholder="Web-App-URL (…/exec)">
    <input id="pin" type="password" inputmode="numeric" placeholder="PIN">
    <input id="device" placeholder="Gerätename (z. B. Kassa 1)">
    <button class="btn primary" onclick="login()">Start</button>
    <div id="msg"></div>
  </div>

  <div id="main" style="display:none">
    <div class="top">
      <div><div>Eingelassen</div><div class="count" id="count">–</div></div>
      <div style="text-align:right"><div id="devName"></div><button class="btn small" onclick="logout()">Abmelden</button></div>
    </div>

    <div class="cam">
      <video id="video" playsinline muted></video>
      <div class="frame"></div>
      <div id="overlay"><div class="t"></div><div class="d"></div></div>
    </div>
    <button id="camBtn" class="btn primary" style="display:none" onclick="startCam()">📷 Kamera starten</button>
    <button id="undoBtn" class="btn" style="display:none" onclick="undo()">↩︎ Letzten Einlass rückgängig</button>

    <div class="row">
      <input id="manual" placeholder="Ticket-ID manuell">
      <button class="btn" onclick="manualCheck()">Prüfen</button>
    </div>
    <ul id="log"></ul>
  </div>
</div>

<script>
/* Optional: Web-App-URL hier fest eintragen, dann muss sie niemand eingeben */
const FIXED_URL = '';

let API = FIXED_URL || localStorage.getItem('f3url') || '';
let PIN = localStorage.getItem('f3pin') || '';
let DEVICE = localStorage.getItem('f3dev') || '';
let lastOkId = null, busy = false, lastCode = '', lastCodeAt = 0, stream = null, detector = null;

if (FIXED_URL) document.getElementById('url').style.display = 'none';
document.getElementById('url').value = API;
document.getElementById('device').value = DEVICE;

/* ---------- API: text/plain verhindert den CORS-Preflight ("Failed to fetch") ---------- */
async function api(body) {
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
    redirect: 'follow'
  });
  const txt = await r.text();
  let j;
  try { j = JSON.parse(txt); } catch (e) { throw new Error('Keine gültige Antwort – doPost/Bereitstellung prüfen'); }
  if (!j.ok) throw new Error(j.error || 'Fehler');
  return j;
}

/* ---------- Login ---------- */
async function login() {
  const url = (FIXED_URL || document.getElementById('url').value).trim();
  const pin = document.getElementById('pin').value.trim() || PIN;
  const dev = document.getElementById('device').value.trim() || 'Scanner';
  const msg = document.getElementById('msg');
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { msg.textContent = 'URL muss mit https://script.google.com beginnen und auf /exec enden'; return; }
  msg.textContent = 'Verbinde …';
  API = url;
  try {
    const j = await api({ action: 'login', pin: pin });
    PIN = pin; DEVICE = dev;
    localStorage.setItem('f3url', API); localStorage.setItem('f3pin', PIN); localStorage.setItem('f3dev', DEVICE);
    showMain(j.stats);
  } catch (e) { msg.textContent = e.message; }
}
function showMain(stats) {
  document.getElementById('setup').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  document.getElementById('devName').textContent = DEVICE;
  setStats(stats);
  startCam();
}
function logout() {
  localStorage.removeItem('f3pin'); PIN = '';
  stopCam();
  document.getElementById('main').style.display = 'none';
  document.getElementById('setup').style.display = 'block';
  document.getElementById('msg').textContent = '';
}
function setStats(s) { if (s) document.getElementById('count').textContent = s.admitted + ' / ' + s.valid; }

/* ---------- Kamera (dauerhaft aktiv) ---------- */
const video = document.getElementById('video');
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

async function startCam() {
  document.getElementById('camBtn').style.display = 'none';
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    if ('BarcodeDetector' in window) {
      try { if ((await BarcodeDetector.getSupportedFormats()).includes('qr_code')) detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) {}
    }
    requestAnimationFrame(tick);
  } catch (e) {
    showOverlay('err', 'Kamera nicht verfügbar', 'Kamerazugriff im Browser erlauben\n(' + e.name + ')', 0);
    document.getElementById('camBtn').style.display = 'block';
  }
}
function stopCam() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; }

let lastScanAt = 0;
async function tick(ts) {
  if (!stream) return;
  if (!busy && ts - lastScanAt > 150 && video.readyState >= 2) {
    lastScanAt = ts;
    const code = await readFrame();
    if (code) onCode(code);
  }
  requestAnimationFrame(tick);
}
async function readFrame() {
  try {
    if (detector) { const r = await detector.detect(video); return r.length ? r[0].rawValue : null; }
    const w = video.videoWidth, h = video.videoHeight, s = Math.min(w, h) * 0.8;
    canvas.width = 480; canvas.height = 480;
    ctx.drawImage(video, (w - s) / 2, (h - s) / 2, s, s, 0, 0, 480, 480);
    const img = ctx.getImageData(0, 0, 480, 480);
    const qr = jsQR(img.data, 480, 480, { inversionAttempts: 'dontInvert' });
    return qr ? qr.data : null;
  } catch (e) { return null; }
}
function onCode(code) {
  const now = Date.now();
  if (code === lastCode && now - lastCodeAt < 4000) return; // gleiches Ticket nicht doppelt
  lastCode = code; lastCodeAt = now;
  check(code);
}

/* ---------- Prüfen ---------- */
async function check(code) {
  busy = true;
  showOverlay('wait', '⏳ Prüfe …', '', 0);
  try {
    const r = (await api({ action: 'check', code: code, pin: PIN, device: DEVICE })).res;
    const info = r.info ? Object.values(r.info).filter(Boolean).join(' · ') : '';
    const icon = r.result === 'ok' ? '✅ ' : r.result === 'used' ? '⚠️ ' : '❌ ';
    showOverlay(r.result, icon + r.title, [info, r.detail, r.id ? 'ID ' + r.id : ''].filter(Boolean).join('\n'), r.result === 'ok' ? 1500 : 3000);
    setStats(r.stats);
    feedback(r.result === 'ok');
    lastOkId = r.result === 'ok' ? r.id : null;
    document.getElementById('undoBtn').style.display = lastOkId ? 'block' : 'none';
    addLog(icon, r.id, r.title);
  } catch (e) {
    if (/PIN/.test(e.message)) { logout(); return; }
    showOverlay('err', '❌ Fehler', e.message, 3000);
    feedback(false);
  }
}
function manualCheck() {
  const v = document.getElementById('manual').value.trim();
  if (!v) return;
  document.getElementById('manual').value = '';
  check(v);
}
async function undo() {
  if (!lastOkId || !confirm('Einlass für ' + lastOkId + ' zurücknehmen?')) return;
  try {
    setStats((await api({ action: 'undo', id: lastOkId, pin: PIN })).stats);
    addLog('↩︎', lastOkId, 'Rückgängig');
    lastOkId = null;
    document.getElementById('undoBtn').style.display = 'none';
  } catch (e) { alert(e.message); }
}

/* ---------- UI ---------- */
let hideTimer;
function showOverlay(cls, title, detail, ms) {
  const o = document.getElementById('overlay');
  clearTimeout(hideTimer);
  o.className = cls; o.style.display = 'flex';
  o.querySelector('.t').textContent = title;
  o.querySelector('.d').textContent = detail || '';
  if (ms) hideTimer = setTimeout(() => { o.style.display = 'none'; busy = false; }, ms);
}
function addLog(icon, id, title) {
  const li = document.createElement('li');
  li.textContent = new Date().toLocaleTimeString('de-AT').slice(0, 5) + '  ' + icon + ' ' + (id || '') + '  ' + title;
  const log = document.getElementById('log');
  log.prepend(li);
  while (log.children.length > 8) log.lastChild.remove();
}
let audio;
function feedback(ok) {
  try { navigator.vibrate && navigator.vibrate(ok ? 120 : [200, 100, 200]); } catch (e) {}
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(); o.connect(audio.destination);
    o.frequency.value = ok ? 1200 : 300;
    o.start(); o.stop(audio.currentTime + (ok ? 0.15 : 0.5));
  } catch (e) {}
}
document.getElementById('manual').addEventListener('keydown', e => { if (e.key === 'Enter') manualCheck(); });
document.getElementById('overlay').addEventListener('click', () => { document.getElementById('overlay').style.display = 'none'; busy = false; });

/* Auto-Login */
if (API && PIN) {
  api({ action: 'login', pin: PIN }).then(j => showMain(j.stats)).catch(() => logout());
}
</script>
</body>
</html>
